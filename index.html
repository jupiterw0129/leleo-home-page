<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#282c34">

    <link rel="icon" type="image/x-icon" href="/favicon.ico" sizes="512x512">

    <!-- Preconnect to external origins -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="preconnect" href="https://api.i-meto.com">
    <link rel="dns-prefetch" href="https://api.i-meto.com">

    <!-- Preload critical local fonts -->
    <link rel="preload" href="/fonts/faken.ttf" as="font" type="font/ttf" crossorigin>
    <link rel="preload" href="/fonts/Digital-Play-Italic-St-1.ttf" as="font" type="font/ttf" crossorigin>
    <link rel="preload" href="/fonts/xy_z.ttf" as="font" type="font/ttf" crossorigin>

    <!-- Critical CSS -->
    <style>
      body{background-color:#282c34;margin:0;overflow:hidden}
      #app{min-height:100vh}
    </style>

    <!-- Google Fonts with async loading -->
    <link
      rel="preload"
      href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@400;600;700&display=swap"
      as="style"
      onload="this.onload=null;this.rel='stylesheet'"
    >
    <noscript>
      <link
        href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@400;600;700&display=swap"
        rel="stylesheet"
      >
    </noscript>

    <link rel="stylesheet" href="/css/style.css">

    <!-- Security headers -->
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: blob:; media-src 'self' blob:; connect-src 'self' https://api.i-meto.com; frame-src 'none'; base-uri 'self'; form-action 'self';">
    <meta name="referrer" content="strict-origin-when-cross-origin">

    <!-- SEO / Social -->
    <meta name="description" content="欢迎来到JupiterW的奇妙世界！">
    <meta name="keywords" content="JupiterW,jupiterw,个人主页,个人网站">
    <meta property="og:title" content="JupiterW的个人主页">
    <meta property="og:description" content="欢迎来到JupiterW的奇妙世界！">
    <meta property="og:type" content="website">
    <meta property="og:site_name" content="JupiterW的个人主页">

    <title>JupiterW的个人主页</title>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
