<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#282c34">

    <link rel="icon" type="image/x-icon" href="/favicon.ico" sizes="512x512">
    <link rel="apple-touch-icon" href="/favicon.ico">
    <link rel="manifest" href="/manifest.json">
    <link rel="stylesheet" href="/css/style.css">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="preconnect" href="https://api.i-meto.com">
    <link rel="dns-prefetch" href="https://api.i-meto.com">
    <link rel="preconnect" href="https://api.ceru.shiqianjiang.cn">
    <link rel="dns-prefetch" href="https://api.ceru.shiqianjiang.cn">
    <link rel="dns-prefetch" href="https://www.bing.com">
    <link rel="dns-prefetch" href="https://www.google.com">
    <link rel="dns-prefetch" href="https://www.baidu.com">

    <link
      rel="preload"
      href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@400;600;700&display=swap"
      as="style"
      onload="this.onload=null;this.rel='stylesheet'"
    >
    <noscript>
      <link
        href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@400;600;700&display=swap"
        rel="stylesheet"
      >
    </noscript>

    <meta name="description" content="欢迎来到JupiterW的奇妙世界！">
    <meta name="keywords" content="JupiterW,jupiterw,个人主页,个人网站">
    <title>JupiterW的个人主页</title>
  </head>
  <body>
    <div id="app"></div>
    <div id="busuanzi-footer">
      <span id="busuanzi_container_site_pv" style="display:none">
        本站总访问 <span id="busuanzi_value_site_pv"></span> 次
        &nbsp;·&nbsp;
      </span>
      <span id="busuanzi_container_site_uv" style="display:none">
        访客 <span id="busuanzi_value_site_uv"></span> 人
      </span>
    </div>
    <canvas id="sparkCanvas"></canvas>
    <link rel="stylesheet" href="/ba-spark/spark.css">
    <script src="/ba-spark/spark.js" defer></script>
    <script async src="//busuanzi.ibruce.info/busuanzi/2.3/busuanzi.pure.mini.js"></script>
    <style>
      #busuanzi-footer {
        position: fixed;
        bottom: 8px;
        left: 50%;
        transform: translateX(-50%);
        z-index: 100;
        font-size: 12px;
        color: rgba(255,255,255,0.55);
        background: rgba(0,0,0,0.25);
        backdrop-filter: blur(10px);
        -webkit-backdrop-filter: blur(10px);
        border-radius: 20px;
        padding: 4px 16px;
        pointer-events: none;
        user-select: none;
      }
      @media (max-width: 768px) {
        #busuanzi-footer { font-size: 10px; padding: 3px 12px; bottom: 4px; }
      }
    </style>
    <script>
      window.addEventListener('DOMContentLoaded', () => {
        const isMobile = window.innerWidth <= 768
        if (isMobile) return
        if (localStorage.getItem('leleo-spark') === '0') return
        if (window.SparkEffect) {
          window.SparkEffect.create('sparkCanvas', {
            color: '45,175,255',
            scale: 1.5,
            opacity: 1.0,
            trailSpeed: 1.0,
            clickSpeed: 1.0,
            enableTrail: true
          })
          if (window.setInputContext) {
            window.setInputContext('mouse', true)
          }
        }
      })
    </script>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
