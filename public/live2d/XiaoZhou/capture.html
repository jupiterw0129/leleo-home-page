<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<title>小周预览截图</title>
<style>
  * { margin: 0; padding: 0; }
  body {
    background: #00b894;
    width: 100vw;
    height: 100vh;
    overflow: hidden;
  }
  #oml2d-stage {
    position: fixed !important;
    left: 50% !important;
    top: 40% !important;
    transform: translate(-50%, -50%) !important;
    bottom: auto !important;
    right: auto !important;
  }
  .hint {
    position: fixed;
    bottom: 20px;
    left: 50%;
    transform: translateX(-50%);
    color: rgba(0,0,0,0.5);
    font-family: sans-serif;
    font-size: 14px;
    text-align: center;
    z-index: 999;
    pointer-events: none;
  }
</style>
</head>
<body>

<div class="hint">截图绿色区域内的人物 → 保存为 icon.webp</div>

<script type="importmap">
{ "imports": { "oh-my-live2d": "https://esm.sh/oh-my-live2d@0.19.3" } }
</script>

<script type="module">
import { loadOml2d } from 'oh-my-live2d'

loadOml2d({
  dockedPosition: 'center',
  mobileDisplay: false,
  models: [{ path: './小周桌宠.model3.json' }],
  statusBar: { disable: true },
  menus: { disable: true },
  tips: { style: { display: 'none' }, welcomeTips: { duration: 0, message: {} } },
})
</script>
</body>
</html>
