<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>404 — 你们是虫子</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: #03050a;
      font-family: 'Noto Serif SC', 'PingFang SC', 'Microsoft YaHei', serif;
      overflow: hidden;
      cursor: default;
      color: #e0d8f0;
      user-select: none;
      gap: 48px;
    }

    canvas#bg { position: fixed; top: 0; left: 0; z-index: 0; }

    /* ====== 倒计时 — 页面居中 ====== */
    .countdown-layer {
      position: relative;
      z-index: 2;
      pointer-events: none;
      text-align: center;
    }

    .countdown-label {
      font-size: 15px;
      color: rgba(255,80,80,0.6);
      letter-spacing: 6px;
      margin-bottom: 16px;
    }

    .countdown-row {
      display: flex;
      align-items: baseline;
      justify-content: center;
      gap: 12px;
      flex-wrap: wrap;
    }

    .cd-block {
      display: flex;
      align-items: baseline;
      gap: 4px;
    }

    .countdown-num {
      font-family: 'Courier New', 'Fira Code', monospace;
      font-weight: 900;
      color: #ff2d2d;
      text-shadow: 0 0 32px rgba(255,45,45,0.7), 0 0 64px rgba(255,45,45,0.35);
      animation: flicker 0.12s infinite alternate;
    }

    .num-y { font-size: clamp(40px, 7vw, 80px); }
    .num-m { font-size: clamp(36px, 6vw, 68px); }
    .num-d { font-size: clamp(34px, 5.5vw, 64px); }
    .num-t { font-size: clamp(28px, 4.5vw, 52px); }

    .countdown-unit {
      font-size: 14px;
      color: rgba(255,120,120,0.55);
      letter-spacing: 2px;
    }

    .cd-colon {
      color: rgba(255,80,80,0.5);
      font-size: clamp(24px, 3.5vw, 40px);
      font-weight: 200;
      margin: 0 -4px;
    }

    @keyframes flicker {
      0% { opacity: 1; }
      85% { opacity: 0.83; }
      100% { opacity: 0.94; }
    }

    /* ====== ETO ====== */
    .eto-mark {
      position: fixed;
      top: 6%;
      left: 6%;
      z-index: 1;
      pointer-events: none;
    }

    .eto-text {
      font-size: 13px;
      color: rgba(200,60,60,0.5);
      letter-spacing: 6px;
      font-family: 'Courier New', monospace;
    }

    .eto-line {
      width: 60px; height: 1px;
      background: rgba(200,60,60,0.35);
      margin: 6px 0;
    }

    /* ====== 主卡片 ====== */
    .wrapper {
      position: relative;
      z-index: 2;
      perspective: 800px;
    }

    .card {
      position: relative;
      background: rgba(15, 12, 30, 0.65);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border-radius: 24px;
      padding: 48px 44px;
      text-align: center;
      max-width: 460px;
      width: 90vw;
    }

    .card::before {
      content: '';
      position: absolute;
      inset: -1px;
      border-radius: 25px;
      padding: 1px;
      background: linear-gradient(160deg, rgba(255,60,60,0.5), transparent 30%, transparent 70%, rgba(255,60,60,0.3));
      -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
      -webkit-mask-composite: xor;
      mask-composite: exclude;
      animation: borderPulse 3s ease-in-out infinite;
    }

    @keyframes borderPulse {
      0%, 100% { opacity: 0.6; }
      50% { opacity: 1; }
    }

    .code {
      font-size: 88px;
      font-weight: 900;
      letter-spacing: 10px;
      line-height: 1;
      margin-bottom: 4px;
      background: linear-gradient(180deg, #ff4d4d 0%, #cc1111 60%, #880808 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      filter: drop-shadow(0 0 20px rgba(255,45,45,0.4));
    }

    .divider {
      width: 40px; height: 1.5px;
      background: rgba(255,60,60,0.5);
      margin: 0 auto 16px;
    }

    .title {
      font-size: 22px;
      font-weight: 600;
      color: #e8d8d8;
      margin-bottom: 6px;
    }

    .subtitle {
      font-size: 14px;
      color: rgba(200,160,160,0.55);
      line-height: 1.8;
      margin-bottom: 32px;
    }

    .quote {
      font-size: 12px;
      color: rgba(180,140,140,0.4);
      font-style: italic;
      margin-bottom: 28px;
    }

    .btn {
      display: inline-block;
      padding: 10px 34px;
      border-radius: 100px;
      background: rgba(200,40,40,0.12);
      border: 1px solid rgba(200,60,60,0.3);
      color: #e0b0b0;
      text-decoration: none;
      font-size: 14px;
      font-weight: 500;
      letter-spacing: 1px;
      transition: all 0.35s;
      position: relative;
    }

    .btn:hover {
      background: rgba(200,40,40,0.22);
      border-color: rgba(255,80,80,0.6);
      color: #ffe0e0;
      box-shadow: 0 0 36px rgba(200,40,40,0.25), 0 0 72px rgba(180,30,30,0.1);
      transform: translateY(-1px);
    }

    @media (max-width: 600px) {
      body { gap: 28px; }
      .card { padding: 36px 24px; }
      .code { font-size: 60px; letter-spacing: 6px; }
      .title { font-size: 18px; }
      .countdown-row { gap: 6px; }
      .cd-block { gap: 2px; }
      .countdown-unit { font-size: 11px; }
    }
  </style>
</head>
<body>

<canvas id="bg"></canvas>

<!-- ETO 标识 -->
<div class="eto-mark">
  <div class="eto-text">E·T·O</div>
  <div class="eto-line"></div>
  <div class="eto-text" style="font-size:10px;letter-spacing:3px;">EARTH-TRISOLARIS</div>
</div>

<!-- 倒计时 — 页面居中 -->
<div class="countdown-layer">
  <div class="countdown-label">距 离 深 红 从 天 而 降</div>
  <div class="countdown-row">
    <div class="cd-block">
      <span class="countdown-num num-y" id="cd-y">11</span>
      <span class="countdown-unit">年</span>
    </div>
    <div class="cd-block">
      <span class="countdown-num num-m" id="cd-mo">01</span>
      <span class="countdown-unit">月</span>
    </div>
    <div class="cd-block">
      <span class="countdown-num num-d" id="cd-d">03</span>
      <span class="countdown-unit">天</span>
    </div>
  </div>
  <div class="countdown-row" style="margin-top:10px;">
    <span class="countdown-num num-t" id="cd-h">23</span>
    <span class="cd-colon">:</span>
    <span class="countdown-num num-t" id="cd-min">59</span>
    <span class="cd-colon">:</span>
    <span class="countdown-num num-t" id="cd-s">59</span>
  </div>
</div>

<!-- 404 卡片 -->
<div class="wrapper">
  <div class="card" id="card">
    <div class="code">404</div>
    <div class="divider"></div>
    <div class="title">你们是虫子</div>
    <div class="subtitle">这段时空坐标上，什么都没有。</div>
    <div class="quote">"不要回答！不要回答！！不要回答！！！"</div>
    <a href="/" class="btn">返回地球</a>
  </div>
</div>

<script>
(function() {
  const canvas = document.getElementById('bg')
  const ctx = canvas.getContext('2d')
  let W, H

  function resize() {
    W = canvas.width = window.innerWidth
    H = canvas.height = window.innerHeight
  }
  resize()
  window.addEventListener('resize', resize)

  // ==================== 星空背景 ====================
  const bgStars = []
  for (let i = 0; i < 200; i++) {
    bgStars.push({
      x: Math.random() * 2000,
      y: Math.random() * 2000,
      r: Math.random() * 1.5 + 0.3,
      twinkle: Math.random() * Math.PI * 2,
      speed: Math.random() * 0.01 + 0.003,
    })
  }

  // ==================== 三体运动模拟 ====================
  class Body {
    constructor(x, y, vx, vy, mass, color, trailLen) {
      this.x = x; this.y = y
      this.vx = vx; this.vy = vy
      this.mass = mass; this.color = color
      this.trail = []; this.trailLen = trailLen
      this.radius = Math.sqrt(mass) * 2.2
    }

    attract(other, G) {
      const dx = other.x - this.x, dy = other.y - this.y
      const dist = Math.sqrt(dx * dx + dy * dy)
      const minDist = (this.radius + other.radius) * 3
      const d = Math.max(dist, minDist)
      const force = (G * this.mass * other.mass) / (d * d)
      return { fx: (force * dx) / d, fy: (force * dy) / d }
    }

    applyForce(fx, fy) { this.vx += fx / this.mass; this.vy += fy / this.mass }

    update() {
      this.x += this.vx; this.y += this.vy
      this.trail.push({ x: this.x, y: this.y })
      if (this.trail.length > this.trailLen) this.trail.shift()
    }

    draw(ctx, cx, cy, scale) {
      const sx = cx + (this.x - cx) * scale, sy = cy + (this.y - cy) * scale
      const r = this.radius * scale

      // 外层光晕 — 缩小
      const outer = ctx.createRadialGradient(sx, sy, r * 0.5, sx, sy, r * 2)
      outer.addColorStop(0, this.color.replace('1)', '0.35)').replace('rgb', 'rgba'))
      outer.addColorStop(1, 'rgba(0,0,0,0)')
      ctx.beginPath(); ctx.arc(sx, sy, r * 2, 0, Math.PI * 2)
      ctx.fillStyle = outer; ctx.fill()

      // 轨道拖尾 — 加粗加亮
      if (this.trail.length > 1) {
        ctx.beginPath()
        ctx.moveTo(cx + (this.trail[0].x - cx) * scale, cy + (this.trail[0].y - cy) * scale)
        for (let i = 1; i < this.trail.length; i++) {
          const p = this.trail[i]
          ctx.lineTo(cx + (p.x - cx) * scale, cy + (p.y - cy) * scale)
        }
        ctx.strokeStyle = this.color.replace('1)', '0.5)').replace('rgb', 'rgba')
        ctx.lineWidth = 2; ctx.stroke()
      }

      // 球体
      const body = ctx.createRadialGradient(sx - r * 0.25, sy - r * 0.3, r * 0.05, sx, sy, r)
      body.addColorStop(0, '#ffffff')
      body.addColorStop(0.1, this.color.replace('1)', '0.95)').replace('rgb', 'rgba'))
      body.addColorStop(0.45, this.color.replace('1)', '0.75)').replace('rgb', 'rgba'))
      body.addColorStop(0.8, this.color.replace('1)', '0.35)').replace('rgb', 'rgba'))
      body.addColorStop(1, this.color.replace('1)', '0.05)').replace('rgb', 'rgba'))
      ctx.beginPath(); ctx.arc(sx, sy, r, 0, Math.PI * 2)
      ctx.fillStyle = body; ctx.fill()

      // 高光点
      ctx.beginPath()
      ctx.arc(sx - r * 0.25, sy - r * 0.3, r * 0.15, 0, Math.PI * 2)
      ctx.fillStyle = 'rgba(255,255,255,0.9)'; ctx.fill()
    }
  }

  // 三颗恒星：红 / 蓝 / 金
  const G = 0.35
  const bodies = [
    new Body(-80, 30, 0.3, 0.5, 30, 'rgb(255,65,35,1)', 90),
    new Body(70, -20, -0.2, -0.4, 25, 'rgb(55,130,255,1)', 80),
    new Body(10, 70, 0.5, -0.1, 35, 'rgb(255,195,50,1)', 100),
  ]

  function simulateThreeBody() {
    const forces = bodies.map(() => ({ fx: 0, fy: 0 }))
    for (let i = 0; i < bodies.length; i++) {
      for (let j = i + 1; j < bodies.length; j++) {
        const { fx, fy } = bodies[i].attract(bodies[j], G)
        forces[i].fx += fx; forces[i].fy += fy
        forces[j].fx -= fx; forces[j].fy -= fy
      }
    }
    for (let i = 0; i < bodies.length; i++) {
      bodies[i].applyForce(forces[i].fx, forces[i].fy)
      bodies[i].update()
    }
  }

  // ==================== 彗星 ====================
  class Comet {
    constructor() {
      this.dead = true
      this.trail = []
    }

    spawn() {
      // 从边缘随机位置出现
      const edge = Math.random()
      if (edge < 0.25)      { this.x = -20; this.y = Math.random() * H }
      else if (edge < 0.5)  { this.x = W + 20; this.y = Math.random() * H }
      else if (edge < 0.75) { this.x = Math.random() * W; this.y = -20 }
      else                  { this.x = Math.random() * W; this.y = H + 20 }

      // 随机方向，偏右下或左下
      const angle = (Math.random() - 0.5) * Math.PI * 0.8 + (this.y > H / 2 ? -Math.PI / 2 : Math.PI / 2)
      const speed = 1.5 + Math.random() * 3
      this.vx = Math.cos(angle) * speed
      this.vy = Math.sin(angle) * speed
      this.trail = []
      this.life = 1
      this.maxTrail = 30 + Math.floor(Math.random() * 50)
      this.size = 1.5 + Math.random() * 2
      // 彗星颜色：白、淡蓝、淡金
      const hue = [0, 210, 45][Math.floor(Math.random() * 3)]
      this.color = `hsla(${hue}, 80%, 75%`
      this.dead = false
    }

    update() {
      if (this.dead) return
      this.x += this.vx; this.y += this.vy
      this.trail.push({ x: this.x, y: this.y })
      if (this.trail.length > this.maxTrail) this.trail.shift()
      // 滑出屏幕后死亡
      if (this.x < -60 || this.x > W + 60 || this.y < -60 || this.y > H + 60) {
        this.dead = true
        this.trail = []
      }
    }

    draw(ctx) {
      if (this.dead || this.trail.length < 2) return

      // 尾部拖尾 — 从旧到新逐渐变亮
      const head = this.trail[this.trail.length - 1]
      for (let i = 1; i < this.trail.length; i++) {
        const p = this.trail[i]
        const alpha = i / this.trail.length
        ctx.beginPath()
        ctx.arc(p.x, p.y, this.size * alpha * 0.7, 0, Math.PI * 2)
        ctx.fillStyle = `${this.color}, ${alpha * 0.6})`
        ctx.fill()
      }

      // 头部光晕
      const glow = ctx.createRadialGradient(head.x, head.y, 0, head.x, head.y, this.size * 6)
      glow.addColorStop(0, 'rgba(255,255,255,0.9)')
      glow.addColorStop(0.15, `${this.color}, 0.7)`)
      glow.addColorStop(0.5, `${this.color}, 0.15)`)
      glow.addColorStop(1, 'rgba(0,0,0,0)')
      ctx.beginPath()
      ctx.arc(head.x, head.y, this.size * 6, 0, Math.PI * 2)
      ctx.fillStyle = glow; ctx.fill()

      // 头部亮点
      ctx.beginPath()
      ctx.arc(head.x, head.y, this.size * 1.2, 0, Math.PI * 2)
      ctx.fillStyle = '#fff'; ctx.fill()
    }
  }

  const comets = []
  const MAX_COMETS = 4
  for (let i = 0; i < MAX_COMETS; i++) comets.push(new Comet())

  // 每 3~8 秒随机发射一颗彗星
  function maybeSpawnComet() {
    const free = comets.find(c => c.dead)
    if (free) free.spawn()
  }
  setInterval(maybeSpawnComet, 3000 + Math.random() * 5000)
  maybeSpawnComet() // 立刻来一颗

  // ==================== 末日倒计时 ====================
  // 危机纪元 1349年6月28日 → 末日 1360年7月31日
  const BASE_YEAR = 2020
  const crisisDate = new Date(BASE_YEAR, 5, 28, 0, 0, 0)
  const doomDate    = new Date(BASE_YEAR + 11, 6, 31, 23, 59, 59) // 1360-07-31 23:59:59
  const anchorReal = Date.now()

  const elY = document.getElementById('cd-y')
  const elMo = document.getElementById('cd-mo')
  const elD = document.getElementById('cd-d')
  const elH = document.getElementById('cd-h')
  const elMin = document.getElementById('cd-min')
  const elS = document.getElementById('cd-s')

  function pad(n) { return String(n).padStart(2, '0') }

  function getCountdown() {
    const elapsed = Date.now() - anchorReal
    const now = new Date(crisisDate.getTime() + elapsed)
    const remaining = doomDate.getTime() - now.getTime()
    if (remaining <= 0) {
      return { y: 0, mo: 0, d: 0, h: 0, m: 0, s: 0 }
    }

    // 逐层推进：年 → 月 → 日 → 时分秒
    let cur = new Date(now)
    let y = 0, mo = 0, d = 0

    while (true) {
      const next = new Date(cur)
      next.setFullYear(cur.getFullYear() + 1)
      if (next.getTime() <= doomDate.getTime()) { y++; cur = next }
      else break
    }
    while (true) {
      const next = new Date(cur)
      next.setMonth(cur.getMonth() + 1)
      if (next.getTime() <= doomDate.getTime()) { mo++; cur = next }
      else break
    }
    while (true) {
      const next = new Date(cur)
      next.setDate(cur.getDate() + 1)
      if (next.getTime() <= doomDate.getTime()) { d++; cur = next }
      else break
    }

    const rem = doomDate.getTime() - cur.getTime()
    const h = Math.floor(rem / 3600000)
    const m = Math.floor((rem % 3600000) / 60000)
    const s = Math.floor((rem % 60000) / 1000)

    return { y, mo, d, h, m, s }
  }

  function updateCountdown() {
    const cd = getCountdown()
    elY.textContent = cd.y
    elMo.textContent = pad(cd.mo)
    elD.textContent = pad(cd.d)
    elH.textContent = pad(cd.h)
    elMin.textContent = pad(cd.m)
    elS.textContent = pad(cd.s)
  }

  updateCountdown()
  setInterval(updateCountdown, 1000)

  // 闪烁效果（致敬原著）
  setInterval(() => {
    if (Math.random() < 0.03) {
      [elY, elMo, elD, elH, elMin, elS].forEach(el => {
        el.style.textShadow = '0 0 60px rgba(255,45,45,1), 0 0 120px rgba(255,0,0,0.7)'
      })
      if (Math.random() < 0.3) {
        elS.textContent = pad(parseInt(elS.textContent) + (Math.random() < 0.5 ? 1 : -1))
      }
      setTimeout(() => {
        updateCountdown()
        ;[elY, elMo, elD, elH, elMin, elS].forEach(el => {
          el.style.textShadow = '0 0 32px rgba(255,45,45,0.7), 0 0 64px rgba(255,45,45,0.35)'
        })
      }, 80 + Math.random() * 120)
    }
  }, 500)

  // ==================== 鼠标视差 ====================
  document.addEventListener('mousemove', e => {
    const card = document.getElementById('card')
    const rx = (e.clientX / W - 0.5) * 4
    const ry = (e.clientY / H - 0.5) * 4
    card.style.transform = `rotateY(${rx}deg) rotateX(${-ry}deg)`
  })

  // ==================== 主循环 ====================
  const simScale = 3.2   // 更大更清晰

  function drawBackground() {
    ctx.clearRect(0, 0, W, H)

    for (const s of bgStars) {
      s.twinkle += s.speed
      const alpha = 0.3 + 0.7 * (0.5 + 0.5 * Math.sin(s.twinkle))
      ctx.beginPath()
      ctx.arc(s.x % W, s.y % H, s.r, 0, Math.PI * 2)
      ctx.fillStyle = `rgba(255,255,255,${alpha})`; ctx.fill()
    }

    simulateThreeBody()
    // 三体运动居中偏左
    const scx = W * 0.35, scy = H * 0.55
    for (const b of bodies) b.draw(ctx, scx, scy, simScale)

    // 彗星
    for (const c of comets) { c.update(); c.draw(ctx) }
  }

  function animate() {
    drawBackground()
    requestAnimationFrame(animate)
  }
  animate()
})();
</script>

</body>
</html>
