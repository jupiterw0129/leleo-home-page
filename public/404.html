<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>404 - 迷路了？</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #1a1a2e;
      font-family: 'Noto Serif SC', 'PingFang SC', 'Microsoft YaHei', serif;
      overflow: hidden;
    }

    .stars {
      position: fixed;
      top: 0; left: 0;
      width: 100%; height: 100%;
      pointer-events: none;
    }

    .star {
      position: absolute;
      background: #fff;
      border-radius: 50%;
      animation: twinkle var(--dur) ease-in-out infinite;
      animation-delay: var(--delay);
      opacity: 0;
    }

    @keyframes twinkle {
      0%, 100% { opacity: 0.2; }
      50% { opacity: 1; }
    }

    .card {
      position: relative;
      z-index: 1;
      background: rgba(255,255,255,0.06);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid rgba(255,255,255,0.1);
      border-radius: 24px;
      padding: 48px 40px;
      text-align: center;
      max-width: 480px;
      width: 90%;
    }

    .symbol {
      font-size: 80px;
      margin-bottom: 20px;
      animation: float 3s ease-in-out infinite;
    }

    @keyframes float {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-12px); }
    }

    .code {
      font-size: 64px;
      font-weight: 700;
      background: linear-gradient(135deg, #a78bfa, #6366f1, #818cf8);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      letter-spacing: 4px;
      margin-bottom: 12px;
    }

    .title {
      font-size: 22px;
      color: #e0e0e0;
      margin-bottom: 8px;
      font-weight: 600;
    }

    .subtitle {
      font-size: 15px;
      color: rgba(255,255,255,0.6);
      line-height: 1.8;
      margin-bottom: 32px;
    }

    .btn {
      display: inline-block;
      padding: 10px 32px;
      border-radius: 100px;
      background: rgba(167, 139, 250, 0.2);
      border: 1px solid rgba(167, 139, 250, 0.4);
      color: #c4b5fd;
      text-decoration: none;
      font-size: 15px;
      transition: all 0.3s;
    }

    .btn:hover {
      background: rgba(167, 139, 250, 0.35);
      border-color: rgba(167, 139, 250, 0.7);
      color: #e0d4ff;
      box-shadow: 0 0 24px rgba(167, 139, 250, 0.2);
    }
  </style>
</head>
<body>

<div class="stars" id="stars"></div>

<div class="card">
  <div class="symbol">🧭</div>
  <div class="code">404</div>
  <div class="title">你迷失在灵界了</div>
  <div class="subtitle">
    这里什么都没有。<br>
    也许「愚者」先生知道路在哪里。
  </div>
  <a href="/" class="btn">返回现世</a>
</div>

<script>
  // 星空背景
  const stars = document.getElementById('stars')
  for (let i = 0; i < 80; i++) {
    const s = document.createElement('div')
    s.className = 'star'
    s.style.left = Math.random() * 100 + '%'
    s.style.top = Math.random() * 100 + '%'
    s.style.width = s.style.height = (Math.random() * 2.5 + 1) + 'px'
    s.style.setProperty('--dur', (Math.random() * 3 + 2) + 's')
    s.style.setProperty('--delay', Math.random() * 5 + 's')
    stars.appendChild(s)
  }
</script>

</body>
</html>
